  100%{

  0%{

    transform:translateY(8px) scale(.9)

  100%{

    transform:translateY(0) scale(1)

}

  0%{
    transform:scale(.4);
    opacity:0

  35%{
    transform:scale(1.25);
    opacity:1
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

  from{
    opacity:0
  }

  to{
    opacity:1
  }
}

@keyframes slideUp{
  from{
    transform:translateY(28px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

<script>
(function(){
  // === 1. UPLOAD DA GALERIA DE VERDADE ===
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'video/*';
  fileInput.style.display = 'none';
  document.body.appendChild(fileInput);
  window.__amemVideoFile = null;
  window.__amemVideoURL = null;
  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    if(f.size > 100*1024*1024){ window.__amem_noop__('Vídeo muito grande. Limite: 100 MB.'); return; }
    window.__amemVideoFile = f;
    try{ window.__amemVideoURL = URL.createObjectURL(f); }catch(e){}
    try{
      var meta = {name:f.name, size:f.size, type:f.type, savedAt: new Date().toISOString()};
      localStorage.setItem('amem_last_upload', JSON.stringify(meta));
      localStorage.setItem('amem_video_saved', '1');
    }catch(e){}
    var toast = document.createElement('div');
    toast.textContent = 'Vídeo salvo! "' + f.name + '" vai aparecer no feed ao publicar.';
    toast.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#FFD700;color:#000;font-weight:800;padding:12px 16px;border-radius:999px;z-index:99999;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)';
    document.body.appendChild(toast);
    setTimeout(function(){ toast.remove(); }, 4000);
  });
  // Quando clicar em "Usar Upload da galeria" ou "Publicar primeiro vídeo", abre o seletor
  document.addEventListener('click', function(e){
    var el = e.target.closest('button');
    if(!el) return;
    var txt = (el.textContent||'').trim();
    if(txt.indexOf('Usar Upload da galeria') !== -1 || txt.indexOf('Publicar primeiro vídeo') !== -1){
      // Deixa o app abrir o editor, mas também abre a galeria
      setTimeout(function(){ fileInput.click(); }, 400);
    }
  });

  // === 2. LIVE TRAVADA ATÉ 30 SEGUIDORES + NOTIFICAÇÃO ===
  function getFollowers(){
    try{
      // Tenta ler seguidores do perfil exibido, senão usa salvo
      var saved = parseInt(localStorage.getItem('amem_followers')||'0',10);
      return isNaN(saved)?0:saved;
    }catch(e){ return 0; }
  }
  function showLiveLocked(){
    var need = 30 - getFollowers();
    var n = document.createElement('div');
    n.innerHTML = '<b>🔒 Live bloqueada</b><br>Você não atingiu 30 seguidores para iniciar live. Você tem '+getFollowers()+' seguidores. Faltam '+need+' para liberar.';
    n.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#141414;color:#fff;border:1px solid #FFD700;padding:20px;border-radius:20px;z-index:99999;max-width:88%;text-align:center;line-height:1.5';
    var btn = document.createElement('button');
    btn.textContent = 'Entendi';
    btn.style.cssText = 'margin-top:14px;background:#FFD700;color:#000;font-weight:800;border:0;padding:12px 20px;border-radius:999px;width:100%';
    btn.onclick = function(){ n.remove(); };
    n.appendChild(btn);
    document.body.appendChild(n);
  }
  function checkLiveUnlock(){
    if(getFollowers() >= 30 && !localStorage.getItem('amem_live_unlocked_notified')){
      localStorage.setItem('amem_live_unlocked_notified','1');
      var n = document.createElement('div');
      n.innerHTML = '🎉 <b>Parabéns!</b><br>Você chegou a 30 seguidores! Sua live está liberada. Toque em + Começar uma live.';
      n.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#FFD700;color:#000;font-weight:700;padding:14px 16px;border-radius:16px;z-index:99999;max-width:92%;text-align:center';
      document.body.appendChild(n);
      setTimeout(function(){ n.remove(); }, 6000);
    }
  }
  // Intercepta cliques em Começar live
  document.addEventListener('click', function(e){
    var el = e.target.closest('button');
    if(!el) return;
    var txt = (el.textContent||'');
    if(txt.indexOf('Começar uma live') !== -1 || txt.indexOf('Começar a primeira live') !== -1){
      if(getFollowers() < 30){
        e.preventDefault(); e.stopPropagation();
        showLiveLocked();
      } else { checkLiveUnlock(); }
    }
  }, true);
  // Feed mantém os botões de live visíveis - o bloqueio é só na hora de iniciar
  function patchFeedLive(){ /* mantém Lives agora e Começar live visíveis no feed */ }
    setInterval(function(){ checkLiveUnlock(); }, 2000);

  // === 3. CÂMERA: LEMBRAR QUE JÁ LIBEROU ===
  var origGetUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices) : null;
  if(origGetUserMedia){
    navigator.mediaDevices.getUserMedia = function(){
      return origGetUserMedia.apply(this, arguments).then(function(stream){
        try{ localStorage.setItem('amem_camera_ok','1'); localStorage.setItem('amem_camera_first_access','1'); }catch(e){}
        return stream;
      });
    };
  }
  // Se já liberou uma vez, esconde o botão "Permitir acesso à câmera" e mostra "Câmera liberada ✓"
  function patchCameraBtn(){
    if(!localStorage.getItem('amem_camera_ok')) return;
    var btns = Array.from(document.querySelectorAll('button'));
    var b = btns.find(function(x){ return (x.textContent||'').indexOf('Permitir acesso à câmera')!==-1; });
    if(b){
      b.textContent = 'Câmera liberada ✓ — tocar para gravar';
      b.style.background = '#1a1a1a';
      b.style.color = '#FFD700';
      b.style.border = '1px solid #FFD700';
    }
    // Esconde avisos repetidos de permissão
    var ps = Array.from(document.querySelectorAll('p'));
    ps.forEach(function(p){
      if(p.textContent.indexOf('Permitir acesso')!==-1 && p.textContent.indexOf('Câmera liberada')===-1){
        p.textContent = 'Câmera já liberada neste aparelho. Pode gravar direto.';
      }
    });
  }
  setInterval(patchCameraBtn, 1500);

  // === 4. SUPABASE: SALVA VÍDEOS, AMÉM, COMENTÁRIOS, LOGIN (quando tabelas existirem) ===
  // O app já tem a URL/chave do Supabase embutida. Este trecho tenta salvar também no Supabase
  // nas tabelas amem_videos, amem_amens, amem_comments, amem_profiles. Se a tabela ainda não existir,
  // ele salva localmente e não mostra erro, para não travar o app.
  window.__amemSupabaseSave = function(table, row){
    try{
      var url = 'https://wkqbcyqutxsnqelcmhyc.supabase.co/rest/v1/' + table;
      var key = localStorage.getItem('amem_supabase_key') || '';
      if(!key) return Promise.resolve(null);
      return fetch(url, {method:'POST', headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=minimal'}, body: JSON.stringify(row)}).catch(function(){ return null; });
    }catch(e){ return Promise.resolve(null); }
  };
})();
</script>


<script>
(function(){
  function hideHomeLive(){
    // Acha o texto "Lives agora" na tela inicial e esconde só aquele bloco
    var all = Array.from(document.querySelectorAll('h2, div, p, span'));
    var title = all.find(function(el){ return (el.textContent||'').trim() === 'Lives agora' || (el.textContent||'').indexOf('Lives agora')!==-1 && el.children.length<=2; });
    // Estratégia mais segura: procura pelo botão "+ Começar uma live" que está no feed (não no menu +)
    var btns = Array.from(document.querySelectorAll('button'));
    var feedLiveBtn = btns.find(function(b){ return (b.textContent||'').trim() === '+ Começar uma live'; });
    if(feedLiveBtn){
      // Sobe até achar o container que tem "Lives agora" + card "Nenhuma live agora"
      var node = feedLiveBtn;
      for(var i=0;i<5 && node;i++){
        node = node.parentNode;
        if(node && node.textContent && node.textContent.indexOf('Nenhuma live agora')!==-1){
          node.style.display = 'none';
          break;
        }
      }
      // Se não achou pelo card, esconde só a linha do título + botão
      if(node && node.style.display !== 'none'){
        var row = feedLiveBtn.parentNode;
        if(row) row.style.display = 'none';
      }
    }
    // Esconde também o card "Nenhuma live agora" / "Começar a primeira live" se ainda estiver visível no feed
    var firstBtn = btns.find(function(b){ return (b.textContent||'').indexOf('Começar a primeira live')!==-1; });
    if(firstBtn){
      var n = firstBtn;
      for(var j=0;j<5 && n;j++){
        n = n.parentNode;
        if(n && n.textContent && n.textContent.indexOf('Nenhuma live agora')!==-1){
          n.style.display = 'none';
          break;
        }
      }
    }
  }
  setInterval(hideHomeLive, 800);
})();
</script>


<script>
(function(){
  // === MODO VISITANTE ===
  var VISITOR_AVATARS = [
    'https://api.dicebear.com/9.x/adventurer/svg?seed=Visitante1&backgroundColor=b6e3f4',
    'https://api.dicebear.com/9.x/adventurer/svg?seed=Visitante2&backgroundColor=ffd5dc',
    'https://api.dicebear.com/9.x/adventurer/svg?seed=Visitante3&backgroundColor=d1f4d9',
    'https://api.dicebear.com/9.x/adventurer/svg?seed=Visitante4&backgroundColor=ffdfbf',
    'https://api.dicebear.com/9.x/adventurer/svg?seed=Visitante5&backgroundColor=e5d4ff'
  ];
  function isVisitor(){
    try{ return localStorage.getItem('amem_is_visitor') === '1'; }catch(e){ return false; }
  }
  function getVisitor(){
    try{ return JSON.parse(localStorage.getItem('amem_visitor')||'null'); }catch(e){ return null; }
  }
  function showToast(msg){
    var n = document.createElement('div');
    n.textContent = msg;
    n.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#141414;color:#fff;border:1px solid #FFD700;padding:14px 16px;border-radius:16px;z-index:99999;max-width:90%;text-align:center;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    document.body.appendChild(n);
    setTimeout(function(){ n.remove(); }, 4000);
  }
  function showVisitorModal(){
    // Se já tem visitante, não mostra de novo
    if(getVisitor()) return;
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.innerHTML = '<div style="background:#141414;border-radius:24px;padding:24px;width:100%;max-width:360px;text-align:center">'
      + '<div style="font-size:40px">👋</div>'
      + '<h2 style="color:#fff;font-size:20px;font-weight:800;margin:10px 0 4px">Entrar como visitante</h2>'
      + '<p style="color:#aaa;font-size:13px;line-height:1.5">Você pode assistir, curtir e comentar. Para publicar e seguir, crie uma conta depois.</p>'
      + '<label style="display:block;text-align:left;color:#fff;font-weight:700;font-size:13px;margin-top:16px">Seu nome</label>'
      + '<input id="amem-visitor-name" placeholder="Como quer ser chamado?" style="width:100%;margin-top:6px;background:#222;border:1px solid #333;border-radius:12px;padding:13px;color:#fff;outline:none;box-sizing:border-box">'
      + '<label style="display:block;text-align:left;color:#fff;font-weight:700;font-size:13px;margin-top:12px">Idade</label>'
      + '<input id="amem-visitor-age" type="number" min="13" max="120" placeholder="Ex: 25" style="width:100%;margin-top:6px;background:#222;border:1px solid #333;border-radius:12px;padding:13px;color:#fff;outline:none;box-sizing:border-box">'
      + '<div id="amem-visitor-error" style="color:#ff8a8a;font-size:13px;margin-top:8px;display:none"></div>'
      + '<button id="amem-visitor-enter" style="width:100%;margin-top:16px;background:#FFD700;color:#000;font-weight:800;border:0;padding:14px;border-radius:999px">Entrar como visitante</button>'
      + '<button id="amem-visitor-back" style="width:100%;margin-top:8px;background:transparent;color:#aaa;border:0;padding:10px">Voltar e criar conta</button>'
      + '</div>';
    document.body.appendChild(overlay);
    var nameInput = overlay.querySelector('#amem-visitor-name');
    var ageInput = overlay.querySelector('#amem-visitor-age');
    var err = overlay.querySelector('#amem-visitor-error');
    overlay.querySelector('#amem-visitor-back').onclick = function(){ overlay.remove(); };
    overlay.querySelector('#amem-visitor-enter').onclick = function(){
      var name = (nameInput.value||'').trim();
      var age = parseInt((ageInput.value||'').trim(),10);
      if(!name){ err.style.display='block'; err.textContent='Conta pra gente seu nome para continuar.'; return; }
      if(!age || age < 13){ err.style.display='block'; err.textContent='Coloque sua idade (mínimo 13 anos).'; return; }
      var avatar = VISITOR_AVATARS[Math.floor(Math.random()*VISITOR_AVATARS.length)];
      var v = {name:name, age:age, avatar:avatar, isVisitor:true, createdAt:new Date().toISOString()};
      try{
        localStorage.setItem('amem_is_visitor','1');
        localStorage.setItem('amem_visitor', JSON.stringify(v));
        localStorage.setItem('amem_visitor_name', name);
      }catch(e){}
      overlay.remove();
      showToast('Bem-vindo, '+name+'! Você está como visitante. Aproveite para conhecer o AMÉM.');
      // Mostra avatar de visitante no perfil se houver
      setTimeout(showVisitorBadge, 500);
    };
  }
  function showVisitorBadge(){
    if(!isVisitor()) return;
    var v = getVisitor(); if(!v) return;
    // Adiciona selo de visitante no perfil se houver avatar
    var imgs = Array.from(document.querySelectorAll('img'));
    // Não força troca de imagens, apenas garante que o nome do visitante apareça em toasts futuros
    // Cria um chip flutuante discreto no topo do perfil quando estiver no perfil
    if(window.location.hash.indexOf('perfil')!==-1 || document.body.textContent.indexOf('Perfil')!==-1){
      // Não duplica
      if(document.getElementById('amem-visitor-chip')) return;
      var chip = document.createElement('div');
      chip.id = 'amem-visitor-chip';
      chip.innerHTML = '<img src="'+v.avatar+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #aaa"> <span>'+v.name+' • Visitante</span>';
      chip.style.cssText = 'display:flex;align-items:center;gap:8px;background:#222;border:1px solid #333;color:#ddd;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999';
      // Só mostra se estiver logado como visitante e na tela de perfil - removido após 4s para não poluir
      // Mantemos apenas no perfil: verifica se há texto "Meu Perfil" ou similar
      if(document.body.textContent.indexOf('Henrique')!==-1){
        document.body.appendChild(chip);
        setTimeout(function(){ chip.remove(); }, 4000);
      }
    }
  }
  // Intercepta "Continuar sem login" -> abre formulário de visitante
  document.addEventListener('click', function(e){
    var el = e.target.closest('button');
    if(!el) return;
    var txt = (el.textContent||'').trim();
    if(txt.indexOf('Continuar sem login')!==-1){
      // Se já tem visitante cadastrado, deixa entrar direto
      if(getVisitor()) return;
      e.preventDefault(); e.stopPropagation();
      // Deixa o app processar o clique depois de 100ms, mas mostra o formulário por cima
      setTimeout(showVisitorModal, 300);
    }
  }, true);

  // Bloqueios do visitante: + (postar), seguir, live
  document.addEventListener('click', function(e){
    if(!isVisitor()) return;
    var el = e.target.closest('button, a');
    if(!el) return;
    var txt = (el.textContent||'').trim();
    var aria = el.getAttribute('aria-label')||'';
    // Botão + central (publicar)
    if(txt === '+' || aria.indexOf('Publicar')!==-1 || aria.indexOf('Criar')!==-1 || txt.indexOf('Publicar')!==-1){
      // Se for o botão + principal, bloqueia
      // Verifica se é o botão central amarelo (tem +)
      if(el.textContent.trim() === '+' || el.innerHTML.indexOf('+')!==-1 && el.className.indexOf('rounded-full')!==-1){
        e.preventDefault(); e.stopPropagation();
        showToast('Para publicar vídeos, crie sua conta gratuita. É rapidinho!');
        return;
      }
    }
    // Seguir perfil
    if(txt === 'Seguir' || txt.indexOf('Seguir')===0){
      e.preventDefault(); e.stopPropagation();
      showToast('Para seguir perfis, crie sua conta. Assim você acompanha quem você gosta.');
      return;
    }
    // Live
    if(txt.indexOf('Começar uma live')!==-1 || txt.indexOf('Entrar AO VIVO')!==-1 || txt.indexOf('Começar a primeira live')!==-1){
      e.preventDefault(); e.stopPropagation();
      showToast('Para fazer live, crie sua conta. Depois, com 30 seguidores, sua live é liberada.');
      return;
    }
    // Upload da galeria dentro do editor
    if(txt.indexOf('Usar Upload da galeria')!==-1 || txt.indexOf('Permitir acesso à câmera')!==-1){
      e.preventDefault(); e.stopPropagation();
      showToast('Para enviar vídeos, crie sua conta gratuita.');
      return;
    }
  }, true);

  // Se for visitante, garante que o avatar dele seja usado em comentários futuros
  window.__amemGetVisitorAvatar = function(){
    var v = getVisitor(); return v ? v.avatar : null;
  };
})();
</script>


<script>
(function(){
  var SUPABASE_URL = 'https://wkqbcyqutxsnqelcmhyc.supabase.co';
  function getKey(){ return (localStorage.getItem('amem_supabase_key') || '').trim(); }
  function loadSdk(){
    if(window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise(function(resolve,reject){
      var existing=document.querySelector('script[data-amem-supabase-auth]');
      if(existing){ existing.addEventListener('load',resolve,{once:true}); existing.addEventListener('error',reject,{once:true}); return; }
      var sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; sc.async=true; sc.setAttribute('data-amem-supabase-auth','1'); sc.onload=resolve; sc.onerror=function(){reject(new Error('Não foi possível carregar a autenticação. Verifique sua conexão.'));}; document.head.appendChild(sc);
    });
  }
  var clientPromise=null;
  function getClient(){
    if(clientPromise) return clientPromise;
    clientPromise=loadSdk().then(function(){
      var key=getKey(); if(!key) throw new Error('A chave anon/public do Supabase não foi encontrada. Configure amem_supabase_key antes de entrar com Google.');
      return window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    }); return clientPromise;
  }
  window.__amemSupabaseAuth={
    signInWithGoogle:async function(){
      var client=await getClient();
      var result=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href.split('#')[0],queryParams:{prompt:'select_account'}}});
      if(result.error) throw result.error;
    }
  };

  // === CORREÇÃO NESSO: retorno do Google ===
  // Problema antigo: finishGoogleLogin() chamava qc(), jr(), us(), F(), Be() que NÃO existem fora do componente React.
  // Isso dava ReferenceError, o login era descartado e o app voltava para a tela inicial.
  // Correção: não usa nenhuma função interna. Cria a sessão via API de records global (M) e dá reload.
  // No reload, o próprio app já carrega a última sessão e entra logado.
  async function finishGoogleLogin(){
    try{
      var client=await getClient();
      // PKCE: se voltou com ?code=, troca pelo token. O SDK com detectSessionInUrl também faz isso.
      var params=new URLSearchParams(window.location.search);
      var code=params.get('code');
      if(code){
        try{ await client.auth.exchangeCodeForSession(code); }catch(e){ /* detectSessionInUrl já pode ter trocado */ }
      }
      var result=await client.auth.getSession();
      var session=result.data && result.data.session;
      if(!session || !session.user || !session.user.email){
        // Ainda pode estar trocando o código - tenta de novo em 800ms
        await new Promise(function(r){setTimeout(r,800);});
        result=await client.auth.getSession();
        session=result.data && result.data.session;
        if(!session || !session.user || !session.user.email) return;
      }
      var user=session.user;
      var email=String(user.email||'').toLowerCase();
      var name=(user.user_metadata && (user.user_metadata.full_name||user.user_metadata.name||user.user_metadata.fullName)) || email.split('@')[0] || 'Fiel Amém';
      var handle='@'+String(name||'fiel').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,20)||'@fiel';
      // Evita loop: se já finalizamos esta sessão, não repete
      if(sessionStorage.getItem('amem_google_callback_done')===user.id) return;
      sessionStorage.setItem('amem_google_callback_done', user.id);
      // Salva perfil/sessão para o app ler no próximo carregamento
      try{ localStorage.setItem('amem_google_profile', JSON.stringify({name:name, handle:handle, email:email, provider:'google', supabase_id:user.id})); }catch(e){}
      // Cria profile + session via API global M (a mesma que o app usa). Se M não existir, o reload ainda vai tentar ler o localStorage.
      try{
        var Mfn = (typeof M!=='undefined' ? M : window.M);
        if(typeof Mfn==='function'){
          var profId=null;
          try{
            var listResp=await Mfn("records.list",{collection:"profiles"});
            var recs=(listResp&&listResp.records)||[];
            var found=null;
            for(var i=0;i<recs.length;i++){ if(recs[i]&&recs[i].value&&String(recs[i].value.email||'').toLowerCase()===email){ found=recs[i]; break; } }
            if(found){ profId=found.id; }
            else{
              var created=await Mfn("records.create",{collection:"profiles", value:{name:name, handle:handle, email:email, provider:'google'}, idempotency_key:'profile-google-'+email+'-'+Date.now()});
              profId=created&&created.id;
            }
          }catch(e){}
          try{ await Mfn("records.create",{collection:"sessions", value:{name:name, handle:handle, email:email, provider:'google'}, idempotency_key:'session-google-'+user.id+'-'+Date.now()}); }catch(e){}
        }
      }catch(e){}
      // Limpa ?code= e #access_token da URL e recarrega - o app vai abrir já logado
      try{
        var clean=window.location.pathname;
        history.replaceState(null,'',clean);
      }catch(e){}
      // Pequeno atraso para a sessão do Supabase persistir antes do reload
      setTimeout(function(){ window.location.reload(); }, 400);
    }catch(e){
      try{ sessionStorage.removeItem('amem_google_callback_done'); }catch(_){}
      // Mostra erro sem usar função interna - cria um aviso visível
      try{
        var d=document.createElement('div');
        d.textContent='Erro ao voltar do Google: '+(e&&e.message||'tente novamente');
        d.style.cssText='position:fixed;top:12px;left:12px;right:12px;z-index:99999;background:#b91c1c;color:#fff;padding:12px;border-radius:12px;font-size:14px;font-weight:700;text-align:center';
        document.body.appendChild(d);
        setTimeout(function(){d.remove();},5000);
      }catch(_){}
    }
  }
  // Corrige também o redirect: usa URL limpa, sem ?code=, sem #hash
  if(window.__amemSupabaseAuth){
    window.__amemSupabaseAuth.signInWithGoogle = async function(){
      var client=await getClient();
      var cleanUrl=window.location.origin + window.location.pathname;
      var result=await client.auth.signInWithOAuth({provider:'google', options:{redirectTo: cleanUrl, queryParams:{prompt:'select_account'}}});
      if(result.error) throw result.error;
    };
  }
  // Roda no load E imediatamente (o load pode já ter passado)
  (function(){
    var hasCallback=window.location.search.indexOf('code=')!==-1 || window.location.hash.indexOf('access_token=')!==-1 || window.location.hash.indexOf('error=')!==-1 || window.location.search.indexOf('error=')!==-1;
    if(hasCallback){
      if(document.readyState==='complete') finishGoogleLogin();
      else window.addEventListener('load', function(){ finishGoogleLogin(); });
      // Fallback: tenta também após 1.5s caso o SDK ainda esteja carregando
      setTimeout(function(){ finishGoogleLogin(); }, 1500);
    } else {
      // Se já tem sessão do Supabase mas o app ainda mostra login, tenta finalizar silenciosamente
      try{
        getClient().then(function(client){ return client.auth.getSession(); }).then(function(r){
          var s=r.data&&r.data.session;
          if(s&&s.user&&s.user.email && !sessionStorage.getItem('amem_google_callback_done')){
            // Só finaliza se houver indício de que voltou do Google agora (evita loop em uso normal)
            if(window.location.search.indexOf('code=')!==-1) finishGoogleLogin();
          }
        }).catch(function(){});
      }catch(e){}
    }
  })();

})();
</script>
