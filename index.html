<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMÉM — Sua fé em movimento</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;padding:28px 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:92px;height:92px;background:#FFD400;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:30px;line-height:.9;letter-spacing:-1px;margin-top:18px;box-shadow:0 10px 30px rgba(255,212,0,.25)}
.subtitle{color:#FFD400;font-weight:800;letter-spacing:3px;font-size:13px;margin:18px 0 28px}
h1{font-size:34px;line-height:1.15;font-weight:800}
.desc{color:#9a9a9a;margin:12px 0 32px;font-size:15px}
.btn{width:100%;padding:16px;border-radius:999px;border:0;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px}
.btn-yellow{background:#FFD400;color:#000}
.btn-white{background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-dark{background:#222;color:#fff}
.divider{display:flex;align-items:center;gap:14px;width:100%;color:#777;margin:14px 0;font-size:14px}
.divider:before,.divider:after{content:"";height:1px;background:#333;flex:1}
.note{color:#777;font-size:13px;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<div class="app">
<div class="logo">AMÉ<br>M</div>
<div class="subtitle">SUA FÉ EM MOVIMENTO</div>
<h1>Entre para continuar<br>sua jornada de fé</h1>
<p class="desc">AMÉM — Sua fé em movimento.</p>
<button class="btn btn-yellow" onclick="alert('Criar conta')">Criar conta</button>
<button class="btn btn-white"><span style="font-size:20px;font-weight:900"><span style="color:#4285F4">G</span></span> Continuar com Google</button>
<div class="divider">ou</div>
<button class="btn btn-dark">Continuar sem login</button>
<p class="note">Como visitante, você assiste, dá Amém e comenta. Para publicar, seguir e fazer Live, crie sua conta quando quiser.</p>
</div>
</body>
</html>
